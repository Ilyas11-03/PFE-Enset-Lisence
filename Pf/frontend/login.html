<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connectez-vous à votre compte - PF Game Store">
    
    <title>Log In - PF Game Store</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" href="image/cover.png" type="image/x-icon">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- Loader -->
    <div class="loader"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="main.html" class="navbar-brand">
                <i class="fa-brands fa-playstation"></i>
                <span>PS5 Store</span>
            </a>
            
            <button class="navbar-toggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="navbar-nav">
                <li><a href="main.html" class="nav-link">Home</a></li>
                <li><a href="game.html" class="nav-link">Games</a></li>
                <li><a href="promotion.html" class="nav-link">Promotions</a></li>
                <li><a href="login.html" class="nav-link active">Log In</a></li>
                <li><a href="signin.html" class="nav-link btn btn-primary" style="padding: 0.5rem 1.5rem;">Sign Up</a></li>
            </ul>
        </div>
    </nav>

    <!-- Login Page -->
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <!-- Header -->
                <div class="login-header">
                    <div class="login-logo">
                        <i class="fa-brands fa-playstation"></i>
                    </div>
                    <h1 class="login-title">Welcome Back</h1>
                    <p class="login-subtitle">Log in to access your account</p>
                </div>

                <!-- Form -->
                <form class="login-form" id="login-form">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input" 
                                placeholder="you@example.com" 
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Enter your password" 
                                required
                            >
                            <button type="button" class="password-toggle" id="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" class="checkbox-input" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-button" id="submit-button">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Log In</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">or</div>

                <!-- Sign Up Link -->
                <p class="signup-text">
                    Don't have an account? 
                    <a href="signin.html" class="signup-link">Sign up now</a>
                </p>

                <!-- Security Badge -->
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure Login - 256-bit SSL Encryption</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Login successful!</span>
    </div>

    <!-- Scripts -->
    <script>
        // Loader
        window.addEventListener("load", () => {
            const loader = document.querySelector(".loader");
            loader.classList.add("loader-hidden");
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Mobile menu toggle
        const navbarToggle = document.querySelector('.navbar-toggle');
        const navbarNav = document.querySelector('.navbar-nav');
        
        navbarToggle.addEventListener('click', () => {
            navbarNav.classList.toggle('active');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navbarNav.classList.remove('active');
            });
        });

        // ========================================
        // PASSWORD TOGGLE
        // ========================================
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        // ========================================
        // FORM SUBMISSION
        // ========================================
        const loginForm = document.getElementById('login-form');
        const submitButton = document.getElementById('submit-button');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validation
            if (!email || !password) {
                showToast('Please fill in all fields', 'error');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address', 'error');
                return;
            }

            // Password validation
            if (password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }

            // Check if email equals password (from original code)
            if (email === password) {
                showToast("You can't login with this account, use another account", 'error');
                return;
            }

            // Simulate login process
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Logging in...</span>';

            setTimeout(() => {
                // Store user info (simulating backend response)
                sessionStorage.setItem('email', email);
                sessionStorage.setItem('password', password);
                
                showToast('Login successful! Redirecting...', 'success');
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'main.html';
                }, 2000);
            }, 1500);
        });

        // Toast notification
        function showToast(message, type = 'success') {
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            if (type === 'error') {
                toast.style.borderLeftColor = '#ef4444';
                toast.querySelector('i').style.color = '#ef4444';
                toast.querySelector('i').className = 'fas fa-exclamation-circle';
            } else {
                toast.style.borderLeftColor = '#22c55e';
                toast.querySelector('i').style.color = '#22c55e';
                toast.querySelector('i').className = 'fas fa-check-circle';
            }
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // Forgot password link
        document.querySelector('.forgot-link').addEventListener('click', function(e) {
            e.preventDefault();
            showToast('Password reset feature coming soon!', 'info');
        });
    </script>
</body>
</html>
