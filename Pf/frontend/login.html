<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<!--Sweet Alert-->
<script src="https://common.olemiss.edu/_js/sweet-alert/sweet-alert.min.js"></script>
<link rel="stylesheet" type="text/css" href="https://common.olemiss.edu/_js/sweet-alert/sweet-alert.css">
    <title>Log In</title>
</head>
<body>
  
    <div class="form-container">
        <p class="title">Welcome</p>
        <form id="myForm" name="form"  >
          <input type="email" class="input" placeholder="Email" name="email" id="email">
         <input type="password" class="input" placeholder="Password" name="password" id="password">
         <p class="page-link">
            <span class="page-link-label">Forgot Password?</span>
          </p>
          <button class="form-btn" id="submit">Log in</button>
        </form>
        <p class="sign-up-label" >
          Don't have an account?<span class="sign-up-link"><a href="signin.html">Sign up</span></a>
        </p>
       
       
        </div>
      </div>
   
      <style>
        body {
           display: flex;
           justify-content: center;
           align-items: center;
           font-size: x-large;
           background: rgb(114, 221, 239);
background: linear-gradient(90deg, rgba(0,207,255,1) 0%, rgba(0,207,255,1) 8%, rgba(0,207,255,1) 12%, rgba(0,207,255,1) 18%, rgba(0,207,255,1) 21%, rgba(0,207,255,0.22181372549019607) 52%);
background-image: url('image/PS5.webp');
        }
        .form-container {
  width: 350px;
  height: 500px;
  background-color: hsl(0, 100%, 100%);

  box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
  border-radius: 10px;
  box-sizing: border-box;
  padding: 20px 30px;
  position: absolute;
  top: 100px;
  background-image: url('');

}

.title {
  text-align: center;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  margin: 10px 0 30px 0;
  font-size: 28px;
  font-weight: 800;
}

#myForm {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 15px;
}

.input {
  border-radius: 20px;
  border: 1px solid #c0c0c0;
  outline: 0 !important;
  box-sizing: border-box;
  padding: 12px 15px;
}

.page-link {
  text-decoration: underline;
  margin: 0;
  text-align: end;
  color: #747474;
  text-decoration-color: #747474;
}

.page-link-label {
  cursor: pointer;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  font-size: 9px;
  font-weight: 700;
}

.page-link-label:hover {
  color: #000;
}

.form-btn {
  padding: 10px 15px;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
  border-radius: 20px;
  border: 0 !important;
  outline: 0 !important;
  background: teal;
  color: white;
  cursor: pointer;
  box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
}

.form-btn:active {
  box-shadow: none;
}

.sign-up-label {
  margin: 0;
  font-size: 10px;
  color: #747474;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
}

.sign-up-link {
  margin-left: 1px;
  font-size: 11px;
  text-decoration: underline;
  text-decoration-color: teal;
  color: teal;
  cursor: pointer;
  font-weight: 800;
  font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
}

.buttons-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  margin-top: 20px;
  gap: 15px;
}


   
      </style>


<script>
  $(document).ready(function() {
    $("#submit").click(function(event) {
      event.preventDefault();
    var email = $("#email").val();
    var password = $("#password").val();

    if (email == "" || password == "") {
      swal ({
        title: "Fill Email and password",
        icon: "warning",
        timer: 3000
      })
    } else if (email == password) {
      swal({
        title: "You can't login with this account , use another account",
        icon: "error"
      })
    } else {
      swal ({
        title: "Login Successful",
        icon: "success",
        timer: 3000
      })
      window.location.href = "/Pf/frontend/main.html";
    }
  } )
  })
 

</script>


</body>
</html>
